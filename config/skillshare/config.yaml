source: ~/.config/skillshare/skills
mode: merge
targets:
  claude:
    path: ~/.claude/skills
  cursor:
    path: ~/.cursor/skills
  junie:
    path: ~/.junie/skills
  pi:
    path: ~/.pi/agent/skills
  windsurf:
    path: ~/.codeium/windsurf/skills
ignore:
  - "**/.DS_Store"
  - "**/.git/**"
audit:
  block_threshold: CRITICAL
