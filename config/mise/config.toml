min_version = "2024.9.5"

[env]
PROJECT_NAME = "{{ config_root | basename }}"

[tools]
awscli    = "2.33.17"
bun       = "latest"
deno      = "2"
elixir    = "1.19.5-otp-28"
erlang    = "28.3"
node      = "lts"
pnpm      = "10"
python    = "3"
ruby      = "4"
rust      = "1"
terraform = "1.14"
uv        = "latest"
zig       = "latest"

# uv tool install -p 3.13 serena-agent@latest --prerelease=allow
"pipx:serena-agent" = { version = "latest", uvx_args = "--python 3.13 --prerelease allow" }

# software verification
# https://mise.jdx.dev/tips-and-tricks.html#software-verification
slsa-verifier = "latest"
cosign        = "latest"

[hooks]
# Enabling corepack will install the `pnpm` package manager specified in your package.json
# alternatively, you can also install `pnpm` with mise
# postinstall = 'npx corepack enable'

[settings]
idiomatic_version_file_enable_tools = []
# https://mise.jdx.dev/mise-cookbook/python.html#mise-uv
#python.uv_venv_auto = true
#python.uv_create_args = ['--seed']
