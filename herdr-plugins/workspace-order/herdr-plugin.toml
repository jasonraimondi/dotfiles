id = "jasonraimondi.workspace-order"
name = "Workspace Order"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Move the focused workspace up or down the sidebar"
platforms = ["linux", "macos"]

[[actions]]
id = "move-up"
title = "Move workspace up"
contexts = ["workspace"]
command = ["node", "src/move.js", "-1"]

[[actions]]
id = "move-down"
title = "Move workspace down"
contexts = ["workspace"]
command = ["node", "src/move.js", "1"]
